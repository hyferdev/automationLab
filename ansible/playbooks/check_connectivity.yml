# ansible/playbooks/check_connectivity.yml

---
- name: Test Connectivity to PAN-OS Firewalls (API Key Method)
  hosts: firewalls
  connection: local
  gather_facts: true

  tasks:
    - name: Run 'show system info' via the API
      paloaltonetworks.panos.panos_op:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        cmd: "show system info"

      # This registers the parsed XML output
      register: system_info_raw

    - name: Display System Info (from XML)
      ansible.builtin.debug:
        var: system_info_raw.stdout_lines
