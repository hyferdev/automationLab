# ansible/playbooks/ConfigureGeneveLogic.yml

---
- name: Configure Routing, Management, and Policies for GWLB
  hosts: firewalls
  connection: local
  gather_facts: false

  vars:
    data_interface: "ethernet1/2"
    tunnel_interface: "tunnel.1"
    data_transport_zone: "zone-gwlb-transport"
    overlay_zone: "zone-overlay" # Simplified: Traffic enters and leaves this zone
    data_vr: "vr-data-plane"
    # AWS GWLB Health Checks usually come from the VPC CIDR or specific subnets.
    # Allowing "any" for the health check rule is common for setup, but lock down in prod.
    health_check_source: "any" 

  tasks:
    # -----------------------------------------------------------------------
    # 1. MANAGEMENT PROFILE (For GWLB Health Checks)
    # -----------------------------------------------------------------------
    - name: Create Management Profile for Health Checks
      paloaltonetworks.panos.panos_management_profile:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        name: "allow-gwlb-probes"
        ping: true
        http: true   # Enable if your Target Group uses HTTP
        https: true  # Enable if your Target Group uses HTTPS

    - name: Attach Management Profile to Data Interface
      paloaltonetworks.panos.panos_interface:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        name: "{{ data_interface }}"
        management_profile: "allow-gwlb-probes"
        # We must repeat these to avoid overwriting existing config
        mode: "layer3"
        enable_dhcp: true 

    # -----------------------------------------------------------------------
    # 2. ROUTING (Send traffic back out the tunnel)
    # -----------------------------------------------------------------------
    - name: Create Default Route for Overlay Traffic
      paloaltonetworks.panos.panos_static_route:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        name: "default-overlay-route"
        vr_name: "{{ data_vr }}"
        destination: "0.0.0.0/0"
        interface: "{{ tunnel_interface }}"
        # In a GWLB setup, we just shove traffic back into the tunnel.
        # AWS handles the actual next-hop routing.
        next_hop_type: "none"

    # -----------------------------------------------------------------------
    # 3. SECURITY POLICIES
    # -----------------------------------------------------------------------
    - name: Create Security Rule - Allow Health Checks
      paloaltonetworks.panos.panos_security_rule:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        rule_name: "Allow-GWLB-Health-Checks"
        source_zone: ["{{ data_transport_zone }}"]
        destination_zone: ["{{ data_transport_zone }}"] # Traffic hits the interface IP (self)
        source_ip: ["{{ health_check_source }}"]
        destination_ip: ["any"]
        application: ["ping", "web-browsing", "ssl"]
        service: ["application-default"]
        action: "allow"
        location: "top"

    - name: Create Security Rule - Allow Overlay Traffic
      paloaltonetworks.panos.panos_security_rule:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        rule_name: "Allow-All-VPC-Traffic"
        source_zone: ["{{ overlay_zone }}"] # Assuming you updated InitialConfig to use one zone
        destination_zone: ["{{ overlay_zone }}"]
        source_ip: ["any"]
        destination_ip: ["any"]
        application: ["any"]
        service: ["application-default"]
        action: "allow"
        location: "after"
        existing_rule: "Allow-GWLB-Health-Checks"

    - name: Commit Configuration
      paloaltonetworks.panos.panos_commit:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        sync: True
        comment: "Ansible: Configured GWLB Routing and Policies"