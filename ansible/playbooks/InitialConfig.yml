# ansible/playbooks/InitialConfig.yml
---
- name: Initial Config for Data Interface
  hosts: firewalls
  connection: local
  gather_facts: false

  vars:
    # Interfaces
    data_interface: "ethernet1/1"
    jumbo_mtu: 8568

    # Zones
    data_zone: "zone-data"

    # Health Checks
    health_check_profile: "allow-probes"
    health_check_source: "any" # Lock this down to VPC CIDR in prod

  tasks:
    # -----------------------------------------------------------------------
    # GLOBAL SETTINGS
    # -----------------------------------------------------------------------
    - name: Enable Jumbo Frames Globally
      paloaltonetworks.panos.panos_config_element:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        edit: true
        xpath: "/config/devices/entry[@name='localhost.localdomain']/deviceconfig/system"
        element: "<jumbo-frame>yes</jumbo-frame>"

    # -----------------------------------------------------------------------
    # NETWORK PROFILES (Health Checks)
    # -----------------------------------------------------------------------
    - name: Create Management Profile for Health Checks
      paloaltonetworks.panos.panos_management_profile:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        name: "{{ health_check_profile }}"
        ping: true
        http: true
        https: true

    # -----------------------------------------------------------------------
    # INTERFACES
    # -----------------------------------------------------------------------
    - name: Configure Data Interface (ethernet1/1) - DHCP/MTU
      paloaltonetworks.panos.panos_interface:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        if_name: "{{ data_interface }}"
        mode: "layer3"
        enable_dhcp: true
        create_default_route: true # Essential for AWS routing
        mtu: "{{ jumbo_mtu }}"
        management_profile: "{{ health_check_profile }}"

    # -----------------------------------------------------------------------
    # ZONES
    # -----------------------------------------------------------------------
    - name: Create Data Zone
      paloaltonetworks.panos.panos_zone:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        zone: "{{ data_zone }}"
        mode: "layer3"

    - name: Assign Data Interface to Zone
      paloaltonetworks.panos.panos_zone:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        zone: "{{ data_zone }}"
        interface: "{{ data_interface }}"

    # -----------------------------------------------------------------------
    # SECURITY
    # -----------------------------------------------------------------------

    - name: Create Security Rule - Allow Health Checks
      paloaltonetworks.panos.panos_security_rule:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        rule_name: "Allow-Health-Checks"
        source_zone: ["{{ data_zone }}"]
        destination_zone: ["{{ data_zone }}"] # Intrazone for interface ping
        source_ip: ["{{ health_check_source }}"]
        destination_ip: ["any"]
        application: ["ping", "web-browsing", "ssl"]
        service: ["application-default"]
        action: "allow"
        location: "top"

    - name: Create Security Rule - Allow All Traffic
      paloaltonetworks.panos.panos_security_rule:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        rule_name: "Allow-All-Traffic"
        source_zone: ["any"]
        destination_zone: ["any"]
        source_ip: ["any"]
        destination_ip: ["any"]
        application: ["any"]
        service: ["application-default"]
        action: "allow"
        location: "after"
        existing_rule: "Allow-Health-Checks"

    - name: Commit Configuration
      paloaltonetworks.panos.panos_commit_firewall:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        sync: true
        description: "Ansible: Initial Config - Data Interface (eth1/1) & Jumbo MTU"
