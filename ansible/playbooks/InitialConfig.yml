# ansible/playbooks/InitialConfig.yml

---
- name: Initial Config for GWLB + TGW (GENEVE)
  hosts: firewalls
  connection: local
  gather_facts: false

  vars:
    data_interface: "ethernet1/2"
    data_transport_zone: "zone-gwlb-transport"
    tunnel_interface: "tunnel.1"
    overlay_zone_in: "zone-tgw-in"
    overlay_zone_out: "zone-internet-out"
    data_vr: "vr-data-plane"

  tasks:
    - name: Configure Data Interface (ethernet1/2) as L3/DHCP
      paloaltonetworks.panos.panos_interface:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        if_name: "{{ data_interface }}"
        mode: "layer3"
        enable_dhcp: true
        create_default_route: true

    - name: Create Logical Tunnel Interface (tunnel.1)
      paloaltonetworks.panos.panos_tunnel:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        if_name: "{{ tunnel_interface }}"
        # This tunnel interface won't have an IP; it's a logical handler

    - name: Create Zones for GWLB traffic
      paloaltonetworks.panos.panos_zone:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        zone: "{{ item }}"
        mode: "layer3"
      loop:
        - "{{ data_transport_zone }}"  # For the physical interface
        - "{{ overlay_zone_in }}"      # For logical traffic from TGW
        - "{{ overlay_zone_out }}"     # For logical traffic to Internet

    - name: Assign Interfaces to Zones
      paloaltonetworks.panos.panos_zone:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        zone: "{{ item.zone }}"
        interface: "{{ item.iface }}"
      loop:
        # The physical interface goes in the transport zone
        - { zone: "{{ data_transport_zone }}", iface: "{{ data_interface }}" }
        # The logical tunnel interface goes in the "IN" zone
        # In a GWLB setup, traffic both enters and exits this one logical interface,
        # so we often assign it to one "overlay" zone and use policy to manage flow.
        # For simplicity, we'll start by assigning it to the "IN" zone.
        - { zone: "{{ overlay_zone_in }}", iface: "{{ tunnel_interface }}" }

    - name: Commit Configuration
      paloaltonetworks.panos.panos_commit_firewall:
        provider:
          ip_address: "{{ ansible_host }}"
          api_key: "{{ panos_api_key }}"
        sync: true
        description: "Ansible: Initial config for GWLB/GENEVE"
