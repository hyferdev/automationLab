[defaults]
# Use the inventory file in this directory
inventory = inventory/firewalls.ini

# Tell Ansible to use your default SSH key
private_key_file = ~/creds/RedKeys.pem

# The admin username for the firewalls
remote_user = admin

# Disable host key checking, as these are new, ephemeral instances.
# WARNING: Do not use this in a production environment without understanding
# the security implications of disabling SSH host key verification.
host_key_checking = False

# Increase timeout to give firewalls time to respond
timeout = 30

# General settings
interpreter_python = /usr/bin/python3.10